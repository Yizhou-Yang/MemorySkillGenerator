[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memlayer"
version = "0.3.0"
description = "memlayer: curated, manifested, append-only memory layer for LLM agents (record / inject / search / time_travel)"
readme = "memlayer/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rapidfuzz>=3.0",
    "json-repair>=0.25",
]

[project.optional-dependencies]
# Semantic retrieval; without these the layer falls back to TF-cosine / overlap.
embeddings = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
]

[tool.setuptools]
# Only the SDK ships. The research harness (scripts/, src/, benchmarks/, tests/)
# stays repo-only — src.latest.* / scripts.latest.evomem_bridge are alias shims
# onto memlayer and are NOT part of the distribution.
packages = ["memlayer"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
